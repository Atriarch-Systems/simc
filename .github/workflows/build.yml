# SimC (SimulationCraft) Fork - Base Image Build
# 
# This workflow:
# 1. Runs daily to sync fork's midnight branch with upstream
# 2. Merges midnight into the atriarch-midnight branch
# 3. Builds the Docker base image used by Simc.Engine.Node
# 4. Triggers the Engine.Node workflow to rebuild with the new base

name: Sync Upstream and Build Base Image

on:
  schedule:
    # Run daily at 3 AM UTC
    - cron: '0 3 * * *'
  push:
    branches: [atriarch-midnight]
  workflow_dispatch:

# Prevent multiple concurrent builds - only one build at a time
concurrency:
  group: simc-build
  cancel-in-progress: false

env:
  IMAGE_NAME: atriarch-simc-simulation
  DOCKER_REGISTRY: docker.atriarch.systems

jobs:
  sync-fork:
    name: Sync Fork with Upstream
    runs-on: [self-hosted, Linux, X64, amd64, arc-amd64]
    outputs:
      synced: ${{ steps.sync-fork.outputs.synced }}
    steps:
      - name: Sync fork's midnight branch with upstream
        id: sync-fork
        env:
          GH_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: |
          # Use GitHub API to sync the fork's midnight branch with upstream
          RESPONSE=$(gh api repos/Atriarch-Systems/simc/merge-upstream \
            -X POST \
            -f branch=midnight \
            2>&1) || true
          if echo "$RESPONSE" | grep -q "merge_type"; then
            echo "synced=true" >> $GITHUB_OUTPUT
            echo "Fork synced with upstream"
            echo "$RESPONSE"
          elif echo "$RESPONSE" | grep -q "already"; then
            echo "synced=false" >> $GITHUB_OUTPUT
            echo "Fork already up to date with upstream"
          else
            echo "synced=false" >> $GITHUB_OUTPUT
            echo "Sync response: $RESPONSE"
          fi

  merge-to-atriarch:
    name: Merge to Atriarch Branch
    runs-on: [self-hosted, Linux, X64, amd64, arc-amd64]
    needs: sync-fork
    outputs:
      changes_detected: ${{ steps.merge.outputs.changes_detected }}
    steps:
      - name: Checkout atriarch-midnight branch
        uses: actions/checkout@v4
        with:
          ref: atriarch-midnight
          fetch-depth: 0
          token: ${{ secrets.GITOPS_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      - name: Merge midnight into atriarch-midnight
        id: merge
        run: |
          # Get the current commit hash before merge
          BEFORE_HASH=$(git rev-parse HEAD)

          # Fetch the updated midnight branch
          git fetch origin midnight

          # Before merging, backup our workflow directory
          cp -r .github/workflows /tmp/our-workflows

          # Try to merge midnight into atriarch-midnight
          if git merge origin/midnight --no-edit -X theirs; then
            # Restore our workflows (overwrite whatever came from upstream)
            rm -rf .github/workflows/*
            cp /tmp/our-workflows/* .github/workflows/

            # Check if there are changes to commit (our workflow restoration)
            if ! git diff --quiet .github/workflows/ 2>/dev/null || ! git diff --cached --quiet .github/workflows/ 2>/dev/null; then
              git add .github/workflows/
              git commit -m "ci: preserve Atriarch workflows after merge" || true
            fi

            AFTER_HASH=$(git rev-parse HEAD)
            if [ "$BEFORE_HASH" != "$AFTER_HASH" ]; then
              echo "changes_detected=true" >> $GITHUB_OUTPUT
              git push origin atriarch-midnight
              echo "Successfully merged midnight into atriarch-midnight"
            else
              echo "changes_detected=false" >> $GITHUB_OUTPUT
              echo "No new changes to merge"
            fi
          else
            echo "Merge conflict detected - manual intervention required"
            git merge --abort
            echo "changes_detected=false" >> $GITHUB_OUTPUT
            exit 1
          fi

  build-and-push:
    name: Build and Push Base Image
    runs-on: [self-hosted, Linux, X64, amd64, arc-amd64]
    needs: merge-to-atriarch
    if: |
      always() &&
      (needs.merge-to-atriarch.outputs.changes_detected == 'true' ||
       github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch')
    outputs:
      image_tag: ${{ steps.set-tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: atriarch-midnight

      - name: Set image tag
        id: set-tag
        run: |
          # Use date-based tag for simc base image
          TAG="v$(date +'%Y%m%d').${{ github.run_number }}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.set-tag.outputs.tag }}
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=registry,ref=${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:cache
          cache-to: type=registry,ref=${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:cache,mode=max

  trigger-engine-node:
    name: Trigger Engine.Node Rebuild
    runs-on: [self-hosted, Linux, X64, amd64, arc-amd64]
    needs: build-and-push
    steps:
      - name: Trigger Engine.Node workflow
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GITOPS_TOKEN }}
          repository: Atriarch-Systems/Atriarch.Simc.Engine.Node
          event-type: simc-base-updated
          client-payload: '{"image_tag": "${{ needs.build-and-push.outputs.image_tag }}"}'

  notify:
    name: Send Notification
    runs-on: [self-hosted, Linux, X64, amd64, arc-amd64]
    needs: [sync-fork, merge-to-atriarch, build-and-push, trigger-engine-node]
    if: always()
    steps:
      - name: Send Discord notification
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_BUILD_NOTIFY_WEBHOOK }}
          title: "SimC Base Image Sync & Build"
          description: |
            **Status:** ${{ needs.build-and-push.result == 'success' && '✅ Success' || needs.build-and-push.result == 'skipped' && '⏭️ Skipped (no changes)' || '❌ Failed' }}
            **Fork Synced:** ${{ needs.sync-fork.outputs.synced == 'true' && 'Yes' || 'No (already up to date)' }}
            **Changes Merged:** ${{ needs.merge-to-atriarch.outputs.changes_detected == 'true' && 'Yes' || 'No' }}
            **Tag:** ${{ needs.build-and-push.outputs.image_tag || 'N/A' }}
            **Engine.Node Trigger:** ${{ needs.trigger-engine-node.result == 'success' && '✅ Triggered' || '⏭️ Skipped' }}
          color: ${{ needs.build-and-push.result == 'success' && '0x00ff00' || needs.build-and-push.result == 'skipped' && '0xffff00' || '0xff0000' }}
